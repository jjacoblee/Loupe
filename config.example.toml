# loupe configuration — copy to ~/.config/loupe/config.toml (global) or to
# .loupe.toml at a repository root (per-repo; wins over the global file).
# Every key is optional. `loupe --help` documents the semantics.
#
# You rarely need to edit this by hand: the first launch runs a setup
# wizard that writes the global file, the in-app theme picker (press t)
# saves your theme choice, and `loupe set-theme <name>` does it from the
# shell.

# Upstream GitHub organization (or user) that pull requests are opened
# against. When set, loupe lists and opens PRs on <org>/<repo-name> instead
# of the clone's own owner — useful for fork workflows and for people who
# work across several organizations. Pin per-project in .loupe.toml.
#org = "acme"

# Default startup mode when no --pr/--local/--auto flag is given:
#   "auto"  — review uncommitted local changes if any, else the PR flow
#   "pr"    — always go straight to pull requests
#   "local" — always review local changes
#mode = "auto"

# Light or dark colors. On "auto" (the default) loupe asks the terminal
# for its background color at startup and tunes the diff greens and reds,
# the gutters, and the chrome to match. Set this to skip detection, or
# pass --light / --dark for one session. `loupe appearance` reports what
# your terminal actually said.
#appearance = "auto"

# Syntax-highlighting themes, one per appearance — a theme is only
# readable on the background it was designed for. `loupe --themes` prints
# every valid name; press t inside loupe for a live-preview picker, and a
# to switch light/dark. Setting only one is fine: the other slot borrows
# from it, staying in the same family where there is a counterpart
# (gruvbox-dark <-> gruvbox-light). Defaults: catppuccin-mocha and
# catppuccin-latte.
#theme = "catppuccin-mocha"
#light_theme = "catppuccin-latte"

# Starting width of the file panel, in columns. Drag the divider between the
# panels (or press < / >) to change it while running; double-click the
# divider to come back to the default of 34.
#file_panel_width = 34

# Language servers. Loupe never installs or bundles one; it looks on your
# PATH for typescript-language-server, gopls or rust-analyzer and starts
# one on demand for `gd` (go to definition), `gr` (find references) and
# `K` (hover). A language with no server falls back to pattern matching.
# `loupe --lsp` reports what was found. Set false to never start one.
#language_servers = true

# Run the language server's formatter (prettier, gofmt, rustfmt — whatever
# it drives) every time the editor saves. Off by default: reformatting a
# file mid-review would add changes to the diff nobody asked for. Ctrl+T
# formats on demand either way, and Ctrl+Z undoes it in one keystroke.
#format_on_save = false

# Re-scan the working tree while local review sits idle, so edits made by
# an agent (or a second terminal) appear without a key press. It waits for
# input to stop, never runs with the editor, an overlay or a selection
# open, and never touches GitHub — a pull request refreshes on demand with
# `r` or the ⟳ button. Toggle it for one session from the ☰ menu.
#auto_refresh = true

# The blame pane, between the file panel and the diff: who last touched
# each line, how long ago, and the pull request it landed in. Off by
# default — it costs a `git blame` per file and about 30 columns of
# width. Press B (or use the ☰ menu) to turn it on for one session.
# Uncommitted lines and lines from the change under review get their own
# colors, so "is this related to what I am doing now?" is answered before
# you read a word.
#blame = false

# Its starting width in columns. Drag the second divider to change it
# while running; double-click that divider to come back to 30. Below
# about 22 columns the pull request number drops out, then the age.
#blame_width = 30

# Ask GitHub which pull request a blamed commit belongs to, for the
# commits whose subject does not already say (a squash or merge commit
# names it, a rebase merge does not). One batched `gh` call per file,
# cached for the session. Set false to stay entirely offline.
#blame_pr_lookup = true

# ---------------------------------------------------------------- servers
#
# Extra language servers. Loupe drives TypeScript, Go and Rust out of the
# box; a `[[server]]` table adds another, or replaces one of those with a
# server you prefer. Nothing is installed or downloaded — loupe looks for
# `command` on your PATH and starts it the first time you ask a question
# about a file it handles.
#
# An extension a built-in server also claims goes to the one here.
# `loupe --lsp` says what it found and what is missing.

# [[server]]
# lang = "Python"
# extensions = ["py", "pyi"]
# command = "pyright-langserver"
# args = ["--stdio"]
# install = "npm install -g pyright"

# [[server]]
# lang = "Ruby"
# extensions = ["rb", "rake"]
# command = "ruby-lsp"
# install = "gem install ruby-lsp"
